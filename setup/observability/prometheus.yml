# Prometheus for the observability profile. It scrapes the gateway's metrics port over the Compose network.
global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: agentgateway
    static_configs:
      - targets: ["agentgateway:15020"]
        labels:
          # The agentgateway Grafana dashboard filters on a namespace label, which a standalone gateway does not have.
          namespace: standalone
