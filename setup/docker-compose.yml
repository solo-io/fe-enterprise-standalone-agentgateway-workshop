name: agentgateway-workshop

services:
  agentgateway:
    image: us-docker.pkg.dev/solo-public/enterprise-agentgateway/agentgateway-enterprise:2026.10.0
    user: "${UID:-1000}:${GID:-1000}"
    restart: unless-stopped
    environment:
      ENTERPRISE_AGENTGATEWAY_LICENSE_KEY: ${ENTERPRISE_AGENTGATEWAY_LICENSE_KEY:?set ENTERPRISE_AGENTGATEWAY_LICENSE_KEY in .env}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?set OPENAI_API_KEY in .env}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Amazon Bedrock. Models with Ambient AWS credentials sign requests with these.
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      BEDROCK_API_KEY: ${BEDROCK_API_KEY:-}
      # Encrypts the UI sign-in cookie for OIDC. Outside the workshop, set your own in .env (openssl rand -hex 32).
      OIDC_COOKIE_SECRET: ${OIDC_COOKIE_SECRET:-8d1b5c0f6a3e47b2a9c4d7e1f0b3a6c58e2d4f7a1c9b0e3d6f8a2c5b7e4d1f03}
    volumes:
      - .:/config
    # Host and container port numbers must match: the UI playgrounds call the gateway on the container port.
    ports:
      - "15000:15000" # admin API and UI
      - "4000:4000"   # LLM traffic
      - "4001:4001"   # MCP and traffic gateway
      - "8080:8080"   # extra traffic gateway
      - "8443:8443"   # HTTPS traffic gateway (tls-termination, sni-matching), with the files in setup/tls/
      - "8180:8180"   # Keycloak (keycloak profile), which shares the gateway's network
      - "6274:6274"   # MCP Inspector (mcp-inspector profile), which shares the gateway's network
      - "15100:15100" # second gateway's admin API and UI (postgres profile), which shares the gateway's network
      - "4100:4100"   # second gateway's LLM traffic (postgres profile)

  # Helper services. Labs that need one start it with: docker compose --profile <name> up -d

  mock-llm:
    profiles: [mock-llm]
    image: ghcr.io/llm-d/llm-d-inference-sim:v1.0.0
    command: ["--model", "mock-gpt", "--port", "8000"]

  mock-llm-429:
    profiles: [mock-llm]
    image: ghcr.io/llm-d/llm-d-inference-sim:v1.0.0
    command: ["--model", "mock-gpt", "--port", "8000", "--failure-injection-rate", "100", "--failure-types", "rate_limit"]

  # mock-llm-faults: mock LLMs that answer slowly, fail some requests, or fail every request.
  mock-llm-slow:
    profiles: [mock-llm-faults]
    image: ghcr.io/llm-d/llm-d-inference-sim:v1.0.0
    command: ["--model", "mock-gpt", "--port", "8000", "--time-to-first-token", "5s"]

  mock-llm-flaky:
    profiles: [mock-llm-faults]
    image: ghcr.io/llm-d/llm-d-inference-sim:v1.0.0
    command: ["--model", "mock-gpt", "--port", "8000", "--failure-injection-rate", "30", "--failure-types", "server_error"]

  mock-llm-503:
    profiles: [mock-llm-faults]
    image: ghcr.io/llm-d/llm-d-inference-sim:v1.0.0
    command: ["--model", "mock-gpt", "--port", "8000", "--failure-injection-rate", "100", "--failure-types", "server_error"]

  mcp-everything:
    profiles: [mcp-everything]
    image: node:22-alpine
    command: ["npx", "-y", "@modelcontextprotocol/server-everything@1.0.0", "streamableHttp"]
    environment:
      PORT: "3001"

  ext-authz:
    profiles: [ext-authz]
    image: ably7/grpc-ext-authz:0.2.0
    environment:
      PORT: "9000"

  # Allows a request only when its JWT has the claim team=platform.
  ext-authz-jwt:
    profiles: [ext-authz-jwt]
    image: ably7/grpc-ext-authz:0.2.0
    environment:
      PORT: "9000"
      AUTH_MODE: jwt
      JWT_REQUIRED_CLAIMS: team=platform

  # Open Policy Agent as a gRPC external authorization service. It reads the Rego policy and JWKS in setup/opa/.
  opa:
    profiles: [opa]
    image: openpolicyagent/opa:1.21.0-envoy-static
    command: ["run", "--server", "--addr=:8181", "--watch", "--config-file=/policy/config.yaml", "/policy/policy.rego", "/policy/data.json"]
    volumes:
      - ./opa:/policy:ro

  # mcp-guardrails: a procurement MCP server and two ExtMCP policy servers that read setup/extmcp/.
  procurement-mcp:
    profiles: [mcp-guardrails]
    image: ably7/procurement-mcp:0.1.1

  extmcp-authz:
    profiles: [mcp-guardrails]
    image: ably7/extmcp-guardrails:0.1.1
    environment:
      CONFIG_PATH: /etc/extmcp/authz.yaml
    volumes:
      - ./extmcp:/etc/extmcp:ro

  extmcp-redact:
    profiles: [mcp-guardrails]
    image: ably7/extmcp-guardrails:0.1.1
    environment:
      CONFIG_PATH: /etc/extmcp/redact.yaml
    volumes:
      - ./extmcp:/etc/extmcp:ro

  # Keycloak runs in the gateway's network, so the browser and the gateway both reach it at
  # http://localhost:8180 and agree on the token issuer.
  keycloak:
    profiles: [keycloak]
    image: quay.io/keycloak/keycloak:26.8.1
    network_mode: "service:agentgateway"
    # token-exchange-delegation (preview) lets a token exchange carry an actor token, for obo-token-exchange Part B.
    command: ["start-dev", "--import-realm", "--http-port=8180", "--http-management-port=9180", "--features=token-exchange-delegation,parameterized-scopes"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro

  guardrail-webhook:
    profiles: [guardrail-webhook]
    image: ably7/ai-guardrail-webhook-server:0.1.2
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:?set OPENAI_API_KEY in .env}
      OPENAI_MODEL: gpt-6-luna
    volumes:
      - ./guardrail-webhook:/policy:ro
    entrypoint: ["/bin/sh", "-c", "export REQUEST_GUARDRAIL_PROMPT=\"$$(cat /policy/request-prompt.txt)\" RESPONSE_GUARDRAIL_PROMPT=\"$$(cat /policy/response-prompt.txt)\"; exec python -m uvicorn main:app --host 0.0.0.0 --port 8000"]

  # MCP Inspector runs in the gateway's network, so it reaches the gateway at localhost:4001 and Keycloak
  # at localhost:8180, and its OAuth callback http://localhost:6274/oauth/callback works from the browser.
  mcp-inspector:
    profiles: [mcp-inspector]
    image: ghcr.io/modelcontextprotocol/inspector:2.9.0
    network_mode: "service:agentgateway"
    command: ["--web", "--transport", "http", "--server-url", "http://localhost:4001/mcp"]
    environment:
      MCP_INSPECTOR_API_TOKEN: workshop
      MCP_INSPECTOR_SECRET_STORE: memory

  # obo: an HTTP echo service that stands in for a downstream API. It returns the request it got,
  # with the decoded JWT from the Authorization header.
  procurement-api:
    profiles: [obo]
    image: mendhak/http-https-echo:37
    environment:
      HTTP_PORT: "8000"
      JWT_HEADER: Authorization

  # stripe-mock: the Stripe API mock, which stands in for a REST API you run yourself. It answers on
  # port 12111 with sample Stripe objects and rejects requests that have no Authorization header.
  stripe-mock:
    profiles: [stripe-mock]
    image: stripe/stripe-mock:v0.206.0

  # observability: Prometheus scrapes the gateway's metrics on port 15020, Tempo receives its traces
  # on port 4317, and Grafana shows both with the agentgateway dashboard. Files are in setup/observability/.
  prometheus:
    profiles: [observability]
    image: prom/prometheus:v3.8.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--web.enable-lifecycle"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "9090:9090"

  tempo:
    profiles: [observability]
    image: grafana/tempo:2.9.0
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro

  grafana:
    profiles: [observability]
    image: grafana/grafana:12.3.0
    environment:
      # Workshop only: anyone who opens Grafana is an admin, with no sign-in.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_USERS_DEFAULT_THEME: system
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"

  # mock-llm-routing: two mock LLMs that each serve a different model name, so a reply shows which one answered.
  mock-llm-mini:
    profiles: [mock-llm-routing]
    image: ghcr.io/llm-d/llm-d-inference-sim:v1.0.0
    command: ["--model", "mock-mini", "--port", "8000"]

  mock-llm-nano:
    profiles: [mock-llm-routing]
    image: ghcr.io/llm-d/llm-d-inference-sim:v1.0.0
    command: ["--model", "mock-nano", "--port", "8000"]

  # semantic-router-jev: an ExtProc adapter that asks Jev (TypeSafe) which price tier a prompt needs and
  # rewrites the model name auto_model to that tier. Code and routing profile are in setup/semantic-router-jev/.
  semantic-router-jev:
    profiles: [semantic-router-jev]
    image: python:3.12.14-slim
    init: true
    command: ["sh", "-c", "pip install --quiet --no-cache-dir --root-user-action=ignore grpcio==1.84.0 xds-protos==1.84.0 && exec python -u /app/adapter.py"]
    environment:
      TYPESAFE_AI_API_KEY: ${TYPESAFE_AI_API_KEY:-}
      JEV_PROFILE_PATH: /app/profile.json
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    volumes:
      - ./semantic-router-jev:/app:ro

  # semantic-router-openai: the same ExtProc adapter, with the OpenAI Decisions API as the classifier.
  # Code and routing profile are in setup/semantic-router-openai/.
  semantic-router-openai:
    profiles: [semantic-router-openai]
    image: python:3.12.14-slim
    init: true
    command: ["sh", "-c", "pip install --quiet --no-cache-dir --root-user-action=ignore grpcio==1.84.0 xds-protos==1.84.0 && exec python -u /app/adapter.py"]
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:?set OPENAI_API_KEY in .env}
      DECISIONS_PROFILE_PATH: /app/profile.json
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    volumes:
      - ./semantic-router-openai:/app:ro

  # guardrail-jev: a guardrail webhook that asks Jev (TypeSafe) to score each rule and each personal value.
  # Code and policy are in setup/guardrail-jev/.
  guardrail-jev:
    profiles: [guardrail-jev]
    image: python:3.12.14-slim
    init: true
    command: ["python", "-u", "/app/webhook.py"]
    environment:
      TYPESAFE_AI_API_KEY: ${TYPESAFE_AI_API_KEY:-}
      GUARDRAIL_POLICY_PATH: /app/policy.json
    volumes:
      - ./guardrail-jev:/app:ro

  # ratelimit: the global rate limit service (envoyproxy/ratelimit) with its Redis counter store.
  # The gateway asks it over gRPC on port 8081 whether a request fits. Rules are in setup/ratelimit/config.yaml.
  redis:
    profiles: [ratelimit]
    image: redis:7.4.11-alpine
    # No snapshots: a restart clears the counts, which is how a lab starts over.
    command: ["redis-server", "--save", "", "--appendonly", "no"]

  ratelimit:
    profiles: [ratelimit]
    image: envoyproxy/ratelimit:f4e76690
    command: ["/bin/ratelimit"]
    depends_on: [redis]
    environment:
      LOG_LEVEL: debug
      REDIS_SOCKET_TYPE: tcp
      REDIS_URL: redis:6379
      USE_STATSD: "false"
      GRPC_PORT: "8081"
      RUNTIME_ROOT: /data
      RUNTIME_SUBDIRECTORY: ratelimit
      RUNTIME_WATCH_ROOT: "false"
      RUNTIME_IGNOREDOTFILES: "true"
    volumes:
      - ./ratelimit/config.yaml:/data/ratelimit/config/config.yaml:ro

  # postgres: a Postgres database for the gateway's request logs and UI changes (postgres-backend lab).
  # No host port: open it with docker compose exec postgres psql -U agentgateway.
  postgres:
    profiles: [postgres]
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: agentgateway
      POSTGRES_USER: agentgateway
      POSTGRES_PASSWORD: agentgateway
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentgateway -d agentgateway"]
      interval: 2s
      timeout: 5s
      retries: 30

  # agentgateway-2: a second gateway on the same Postgres database, with its config in setup/postgres/.
  # It runs in the first gateway's network on other ports: UI on 15100, LLM traffic on 4100.
  # Restarting the first gateway disconnects it, so stop it first.
  agentgateway-2:
    profiles: [postgres]
    image: us-docker.pkg.dev/solo-public/enterprise-agentgateway/agentgateway-enterprise:2026.10.0
    user: "${UID:-1000}:${GID:-1000}"
    network_mode: "service:agentgateway"
    command: ["-f", "/config/postgres/gateway-2.yaml"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ENTERPRISE_AGENTGATEWAY_LICENSE_KEY: ${ENTERPRISE_AGENTGATEWAY_LICENSE_KEY:?set ENTERPRISE_AGENTGATEWAY_LICENSE_KEY in .env}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?set OPENAI_API_KEY in .env}
    volumes:
      - .:/config:ro
