# Test override: publish no host ports. Playwright joins the gateway's network namespace instead,
# so tests use the real ports and several runs can go in parallel.
services:
  agentgateway:
    ports: !reset []
    restart: "no"
  # Helpers that publish their own host ports. The test browser reaches them by service name.
  prometheus:
    ports: !reset []
  grafana:
    ports: !reset []
