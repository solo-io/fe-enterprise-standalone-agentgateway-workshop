# yaml-language-server: $schema=https://agentgateway.dev/schema/config
# Starting configuration for the workshop. The UI edits this file when you save changes.
config:
  adminAddr: 0.0.0.0:15000
  database:
    url: sqlite:///config/data.db
  modelCatalog:
    - file: /config/base-costs.json
llm:
  port: 4000
  policies:
    cors:
      allowOrigins:
        - http://localhost:15000
      allowHeaders:
        - '*'
      allowMethods:
        - GET
        - POST
  models:
    - name: openai/*
      provider: openai
      params:
        apiKey: $OPENAI_API_KEY
      transformation:
        model: llmRequest.model.stripPrefix("openai/")
frontendPolicies:
  http:
    maxBufferSize: 33554432
gateways:
  default:
    port: 4001
mcp:
  gateways: default
  targets:
    - name: solo-docs
      mcp:
        host: https://search.solo.io/mcp
  policies:
    cors:
      allowOrigins:
      - http://localhost:15000
      allowHeaders:
      - '*'
      allowMethods:
      - GET
      - POST
      exposeHeaders:
      - Mcp-Session-Id
